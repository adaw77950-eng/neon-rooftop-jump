<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#090a1a" />
    <title>霓虹跃迁｜离线版</title>
    <meta name="description" content="按住蓄力，松开跃过霓虹屋顶。原创像素风浏览器小游戏。" />
    <style>
:root {
  color-scheme: dark;
  --ink: #080915;
  --paper: #e9fff7;
  --cyan: #58f6e7;
  --pink: #ff4fa3;
  --amber: #ffd05a;
  --panel: rgba(8, 9, 21, 0.9);
  --pixel-shadow: 4px 4px 0 #000;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100%;
  margin: 0;
  overscroll-behavior: none;
  background: #050611;
}

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--paper);
  font-family: "Courier New", "Noto Sans Mono CJK SC", monospace;
  background:
    linear-gradient(rgba(88, 246, 231, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88, 246, 231, .05) 1px, transparent 1px),
    radial-gradient(circle at 50% -10%, #243055 0, #0b0c1f 42%, #050611 76%);
  background-size: 28px 28px, 28px 28px, auto;
  -webkit-user-select: none;
  user-select: none;
}

button { font: inherit; }

.game-shell {
  position: relative;
  width: min(100vw, 520px);
  height: min(100dvh, 860px);
  padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
}

.brand-bar, .status-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.brand-lockup { display: grid; gap: 1px; }
.brand-lockup strong { font-size: 18px; letter-spacing: .16em; color: var(--paper); }
.brand-kicker, .status-strip { font-size: 10px; color: #8393a8; }

.screen-frame {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 2px solid rgba(88, 246, 231, .55);
  border-radius: 2px;
  background: var(--ink);
  box-shadow: 0 0 0 4px #080915, 0 0 28px rgba(88, 246, 231, .15);
  touch-action: none;
}

.screen-frame::before,
.screen-frame::after {
  content: "";
  position: absolute;
  z-index: 8;
  width: 24px;
  height: 24px;
  pointer-events: none;
}
.screen-frame::before { top: 8px; left: 8px; border-top: 3px solid var(--pink); border-left: 3px solid var(--pink); }
.screen-frame::after { right: 8px; bottom: 8px; border-right: 3px solid var(--cyan); border-bottom: 3px solid var(--cyan); }

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  opacity: .14;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.18) 3px 4px);
  mix-blend-mode: overlay;
}

.panel {
  position: absolute;
  z-index: 7;
  inset: 0;
  padding: clamp(28px, 8vw, 52px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  background: linear-gradient(105deg, rgba(5, 6, 17, .96) 0 46%, rgba(5, 6, 17, .55) 76%, transparent 100%);
  contain: layout paint;
}

.panel[hidden] { display: none; }
.panel.is-dismissed {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
}
.eyebrow { margin: 0 0 14px; color: var(--cyan); font-size: 11px; letter-spacing: .15em; }
.start-panel h1 {
  margin: 0;
  color: var(--paper);
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: clamp(48px, 13vw, 72px);
  font-weight: 1000;
  line-height: .88;
  letter-spacing: -.07em;
  -webkit-text-stroke: 1px var(--paper);
  paint-order: stroke fill;
  text-shadow:
    3px 0 0 #17213c,
    6px 3px 0 #17213c,
    9px 6px 0 rgba(0, 0, 0, .65);
  transform: skewY(-2deg);
}
.start-panel h1 span {
  color: var(--pink);
  -webkit-text-stroke-color: var(--pink);
  text-shadow:
    3px 0 0 #471c4d,
    6px 3px 0 #471c4d,
    9px 6px 0 rgba(0, 0, 0, .65);
}
.lede { max-width: 310px; margin: 24px 0 26px; color: #b9c8d5; font-size: 13px; line-height: 1.8; }
.meta-wallet { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; color: var(--amber); }
.meta-wallet span { font-size: 10px; letter-spacing: .12em; }
.meta-wallet strong { font-size: 22px; }
.mode-grid { width: min(320px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.mode-grid .primary { grid-column: 1 / -1; width: 100%; }
.mode-grid .pixel-button { min-width: 0; }
.mode-grid small { display: block; margin-top: 3px; font-size: 8px; opacity: .72; }
.task-list { width: min(320px, 100%); display: grid; gap: 5px; margin-top: 14px; }
.task-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; color: #91a1b5; font-size: 9px; }
.task-row span:last-child { color: var(--amber); }
.control-copy { margin: 18px 0 0; max-width: 310px; color: #7f8ea1; font-size: 10px; line-height: 1.7; }
.control-copy b { color: var(--amber); }

.pixel-button {
  border: 1px solid var(--cyan);
  border-radius: 0;
  padding: 10px 14px;
  color: var(--cyan);
  background: #0b1222;
  box-shadow: var(--pixel-shadow);
  cursor: pointer;
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: .08em;
}
.pixel-button:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #000; }
.pixel-button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
.pixel-button.primary { min-width: 190px; color: #07131b; border-color: var(--cyan); background: var(--cyan); }
.pixel-button:disabled { cursor: default; opacity: .48; transform: none; box-shadow: 2px 2px 0 #000; }
.icon-button { padding: 8px 10px; font-size: 10px; }

.game-over-panel { align-items: center; text-align: center; background: rgba(5, 6, 17, .9); }
.game-over-panel h2 { margin: 0 0 24px; color: var(--pink); font-size: 36px; letter-spacing: .1em; }
.result-grid { width: min(300px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.result-grid div { padding: 14px; border: 1px solid #34415b; background: rgba(13, 18, 37, .9); }
.result-grid span { display: block; color: #8091a6; font-size: 10px; }
.result-grid strong { display: block; margin-top: 5px; color: var(--paper); font-size: 28px; }
.record-message { min-height: 20px; margin: 0 0 18px; color: var(--amber); font-size: 12px; }
.game-over-panel #menuButton { margin-top: 12px; }
.skins-panel { align-items: stretch; justify-content: center; padding: clamp(22px, 6vw, 38px); background: radial-gradient(circle at 78% 12%, rgba(255,79,163,.13), transparent 35%), rgba(5, 6, 17, .97); overflow: hidden; }
.shop-heading { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.shop-heading .eyebrow { margin-bottom: 5px; }
.shop-heading h2 { margin: 0; color: var(--paper); font: 1000 27px/1 "Microsoft YaHei UI", sans-serif; letter-spacing: -.04em; }
.coin-chip { align-self: center; padding: 8px 10px; border: 1px solid rgba(255,208,90,.55); color: var(--amber); background: rgba(255,208,90,.08); font-size: 12px; box-shadow: 3px 3px 0 #000; }
.skin-stage { --skin-body: #18203b; --skin-accent: #ff4fa3; position: relative; min-height: 250px; display: grid; grid-template-columns: 42% 58%; align-items: center; margin: 16px 0 12px; overflow: hidden; border: 1px solid rgba(88,246,231,.36); background: linear-gradient(135deg, rgba(15,20,46,.95), rgba(31,18,50,.93)); box-shadow: inset 0 0 40px rgba(88,246,231,.05), 5px 5px 0 #000; }
.stage-grid { position: absolute; inset: 0; opacity: .16; background: linear-gradient(rgba(88,246,231,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(88,246,231,.35) 1px, transparent 1px); background-size: 26px 26px; transform: perspective(220px) rotateX(55deg) scale(1.5); transform-origin: bottom; }
.skin-stage::after { content: "LOADOUT PREVIEW"; position: absolute; right: 12px; top: 10px; color: rgba(88,246,231,.35); font-size: 8px; letter-spacing: .16em; }
.shop-avatar { position: relative; width: 72px; height: 118px; margin: 15px auto 0; filter: drop-shadow(0 0 16px var(--skin-accent)); animation: avatar-idle 1.5s steps(2) infinite; }
.shop-avatar::before { content: ""; position: absolute; left: 20px; top: 0; width: 34px; height: 28px; border-top: 11px solid #13172c; background: #ffd7ba; box-shadow: -5px 6px 0 #13172c; }
.shop-avatar::after { content: ""; position: absolute; left: 5px; bottom: 0; width: 64px; height: 8px; background: rgba(0,0,0,.45); }
.shop-avatar i { position: absolute; left: 15px; top: 28px; width: 42px; height: 68px; border-left: 10px solid var(--skin-accent); background: var(--skin-body); box-shadow: 7px 5px 0 rgba(0,0,0,.55); }
.shop-avatar b, .shop-avatar span { position: absolute; bottom: 11px; width: 17px; height: 25px; background: #050611; }
.shop-avatar b { left: 15px; }
.shop-avatar span { right: 15px; }
.shop-avatar[data-shape="courier"]::before { left: 18px; top: 1px; width: 39px; height: 27px; border: 6px solid var(--skin-body); border-bottom: 9px solid var(--skin-accent); background: #0a1020; box-shadow: 7px 7px 0 rgba(0,0,0,.45); }
.shop-avatar[data-shape="courier"] i { left: 19px; top: 34px; width: 37px; height: 59px; border: 0; border-right: 9px solid #0b1425; background: var(--skin-body); }
.shop-avatar[data-shape="courier"] i::after { content: ""; position: absolute; right: -17px; top: 8px; width: 12px; height: 38px; background: var(--skin-accent); box-shadow: 4px 4px 0 #000; }
.shop-avatar[data-shape="courier"] b { left: 19px; width: 14px; }
.shop-avatar[data-shape="courier"] span { right: 17px; width: 14px; }
.shop-avatar[data-shape="glitch"]::before { left: 14px; top: 0; width: 46px; height: 40px; border: 9px solid var(--skin-accent); border-bottom-width: 5px; background: #100b1c; clip-path: polygon(20% 0, 80% 0, 100% 35%, 88% 100%, 12% 100%, 0 35%); box-shadow: none; }
.shop-avatar[data-shape="glitch"] i { left: 10px; top: 36px; width: 54px; height: 65px; border: 0; background: var(--skin-body); clip-path: polygon(18% 0, 82% 0, 100% 100%, 62% 88%, 48% 100%, 0 88%); box-shadow: 8px 4px 0 rgba(255,79,163,.35); }
.shop-avatar[data-shape="glitch"] i::after { content: ""; position: absolute; left: 12px; top: 8px; width: 32px; height: 6px; background: var(--skin-accent); box-shadow: -10px 18px 0 -1px var(--skin-accent), 34px 32px 0 -1px var(--skin-accent); }
.shop-avatar[data-shape="glitch"] b { left: 16px; width: 13px; transform: skewX(-8deg); }
.shop-avatar[data-shape="glitch"] span { right: 13px; width: 18px; transform: skewX(12deg); }
.skin-detail { position: relative; z-index: 1; padding: 32px 20px 20px 4px; }
.rarity-badge { display: inline-block; padding: 4px 7px; color: var(--skin-accent); border: 1px solid currentColor; font-size: 8px; letter-spacing: .16em; }
.skin-detail h3 { margin: 12px 0 8px; color: var(--paper); font: 900 23px/1.1 "Microsoft YaHei UI", sans-serif; }
.skin-detail p { min-height: 44px; margin: 0 0 18px; color: #a7b5c6; font-size: 10px; line-height: 1.7; }
.price-progress { display: grid; gap: 7px; color: var(--amber); font-size: 9px; }
.price-progress > i { height: 5px; overflow: hidden; background: #25314c; }
.price-progress > i > b { display: block; width: 0; height: 100%; background: var(--skin-accent); transition: width .28s steps(5); }
.skin-rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.skin-card { position: relative; min-width: 0; display: grid; justify-items: center; gap: 7px; padding: 9px 4px; border: 1px solid #34415b; background: rgba(13,18,37,.94); color: var(--paper); cursor: pointer; }
.skin-card.is-selected { border-color: var(--skin-accent); transform: translateY(-3px); box-shadow: 0 3px 0 var(--skin-accent); }
.skin-card.is-equipped::after { content: "E"; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; display: grid; place-items: center; color: #07131b; background: var(--cyan); font: 700 8px monospace; }
.skin-swatch { width: 25px; height: 30px; border: 4px solid var(--skin-accent); background: var(--skin-body); box-shadow: 3px 3px 0 #000; }
.skin-swatch--courier { width: 29px; height: 27px; border-width: 5px 4px 8px; border-color: var(--skin-body) var(--skin-body) var(--skin-accent); background: #0a1020; }
.skin-swatch--glitch { width: 32px; height: 30px; border-width: 6px 6px 3px; background: var(--skin-body); clip-path: polygon(20% 0, 80% 0, 100% 30%, 88% 100%, 12% 100%, 0 30%); box-shadow: 4px 3px 0 rgba(255,79,163,.4); }
.skin-card strong { max-width: 100%; overflow: hidden; color: #aebdcb; font-size: 8px; white-space: nowrap; text-overflow: ellipsis; }
.shop-message { min-height: 16px; margin: 9px 0; color: var(--cyan); font-size: 9px; text-align: center; }
.shop-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.shop-actions .primary { width: 100%; }
@keyframes avatar-idle { 50% { transform: translateY(-4px); } }

.tutorial {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 13%;
  width: 190px;
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 14px;
  color: var(--paper);
  background: rgba(7, 9, 23, .78);
  border: 1px solid rgba(88, 246, 231, .6);
  pointer-events: none;
  text-align: center;
}
.tutorial[hidden] { display: none; }
.tutorial .finger { display: grid; place-items: center; width: 34px; height: 34px; color: var(--pink); border: 2px solid var(--pink); border-radius: 50%; animation: charge-pulse 1.1s steps(3) infinite; }
.tutorial strong { font-size: 13px; }
.tutorial small { color: #8798ac; font-size: 10px; }

.status-strip { min-height: 18px; }
.status-strip span:last-child { color: var(--pink); }

@keyframes charge-pulse {
  0%, 100% { transform: scale(.85); box-shadow: 0 0 0 0 rgba(255,79,163,.6); }
  50% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255,79,163,0); }
}

@media (min-width: 780px) and (min-height: 720px) {
  .game-shell { width: 520px; }
}

@media (max-height: 640px) {
  .game-shell { padding-block: 6px; gap: 6px; }
  .brand-bar { display: none; }
  .status-strip { display: none; }
  .start-panel h1 { font-size: 48px; }
  .lede { margin: 16px 0; }
  .task-list, .control-copy { display: none; }
  .skins-panel { padding: 20px; }
}

@media (pointer: coarse) {
  .pixel-button:hover { transform: none; box-shadow: var(--pixel-shadow); }
  .scanlines { opacity: .06; mix-blend-mode: soft-light; }
}

@media (prefers-reduced-motion: reduce) {
  .tutorial .finger { animation: none; }
}

</style>
  </head>
  <body>
    <main class="game-shell" aria-label="霓虹跃迁像素跳跃游戏">
      <header class="brand-bar">
        <div class="brand-lockup">
          <span class="brand-kicker">NIGHT COURIER / 01</span>
          <strong>霓虹跃迁</strong>
        </div>
        <button id="muteButton" class="pixel-button icon-button" type="button" aria-label="切换声音">声音 ON</button>
      </header>

      <section class="screen-frame">
        <canvas id="gameCanvas" width="480" height="720" aria-label="游戏画面"></canvas>
        <div class="scanlines" aria-hidden="true"></div>

        <section id="startPanel" class="panel start-panel">
          <p class="eyebrow">ROOFTOP DELIVERY PROTOCOL</p>
          <h1>霓虹<br /><span>跃迁</span></h1>
          <p class="lede">城市断电前，把最后一枚数据芯片送到天际线尽头。</p>
          <div class="meta-wallet"><span>PIXEL COINS</span><strong id="coinCount">0</strong></div>
          <div class="mode-grid">
            <button id="startButton" class="pixel-button primary" type="button">普通模式</button>
            <button id="dailyButton" class="pixel-button" type="button">每日挑战 <small id="dailyStatus">12 跳</small></button>
            <button id="skinsButton" class="pixel-button" type="button">皮肤商店</button>
          </div>
          <div id="taskList" class="task-list" aria-label="任务进度"></div>
          <p class="control-copy"><b>电脑</b> 按住鼠标 · <b>手机</b> 长按屏幕 · 松开起跳</p>
        </section>

        <section id="skinsPanel" class="panel skins-panel" hidden>
          <div class="shop-heading">
            <div><p class="eyebrow">COURIER LOADOUT</p><h2>霓虹装备舱</h2></div>
            <span class="coin-chip">◈ <strong id="shopCoinCount">0</strong></span>
          </div>
          <div id="skinStage" class="skin-stage">
            <div class="stage-grid" aria-hidden="true"></div>
            <div id="shopAvatar" class="shop-avatar" aria-hidden="true"><i></i><b></b><span></span></div>
            <div class="skin-detail">
              <span id="skinRarity" class="rarity-badge">标准</span>
              <h3 id="skinName">夜班信使</h3>
              <p id="skinTagline">城市熄灯后，仍有人替你送达。</p>
              <div class="price-progress"><span id="skinPriceText">已拥有</span><i><b id="skinPriceBar"></b></i></div>
            </div>
          </div>
          <div id="skinGrid" class="skin-rail" aria-label="选择皮肤"></div>
          <p id="shopMessage" class="shop-message"></p>
          <div class="shop-actions">
            <button id="skinActionButton" class="pixel-button primary" type="button">装备</button>
            <button id="closeSkinsButton" class="pixel-button" type="button">返回</button>
          </div>
        </section>

        <section id="gameOverPanel" class="panel game-over-panel" hidden>
          <p id="gameOverEyebrow" class="eyebrow">SIGNAL LOST</p>
          <h2 id="gameOverTitle">坠入暗巷</h2>
          <div class="result-grid">
            <div><span>本局</span><strong id="finalScore">0</strong></div>
            <div><span>最高</span><strong id="bestScore">0</strong></div>
          </div>
          <p id="recordMessage" class="record-message"></p>
          <button id="restartButton" class="pixel-button primary" type="button">再跑一局</button>
          <button id="menuButton" class="pixel-button" type="button">返回主菜单</button>
        </section>

        <div id="tutorial" class="tutorial" hidden>
          <span class="finger">◉</span>
          <strong>按住蓄力</strong>
          <small>松开后向前跃出</small>
        </div>
      </section>

      <footer class="status-strip">
        <span>原创像素实验体</span>
        <span id="deviceHint">POINTER READY</span>
      </footer>
    </main>
    <script type="module">
const MAX_CHARGE_MS = 1400;
function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
function chargeRatio(milliseconds, maximum = MAX_CHARGE_MS) { return clamp(milliseconds / maximum, 0, 1); }
function easeOutCubic(value) { const t = clamp(value, 0, 1); return 1 - (1 - t) ** 3; }
function jumpFromCharge(ratio) {
  const charged = easeOutCubic(ratio);
  return { distance: 34 + charged * 154, height: 34 + charged * 58, duration: 0.42 + charged * 0.32 };
}
function ballisticPoint(jump, progress) {
  const t = clamp(progress, 0, 1);
  const x = jump.startX + (jump.endX - jump.startX) * t;
  const baselineY = jump.startY + (jump.endY - jump.startY) * t;
  const y = baselineY - 4 * jump.height * t * (1 - t);
  return { x, y };
}
function classifyLanding(playerCenterX, platform) {
  const left = platform.x;
  const right = platform.x + platform.width;
  if (playerCenterX < left || playerCenterX > right) return 'miss';
  const center = left + platform.width / 2;
  if (Math.abs(playerCenterX - center) <= platform.width * 0.14) return 'perfect';
  const edgeBand = Math.max(7, platform.width * 0.11);
  if (playerCenterX - left <= edgeBand || right - playerCenterX <= edgeBand) return 'edge';
  return 'safe';
}
function difficultyAt(score) { return clamp(score / 32, 0, 1); }
function makeNextPlatform(current, score, random = Math.random) {
  const opening = score < 3;
  const difficulty = difficultyAt(score);
  const width = opening ? 78 + random() * 18 : 92 - difficulty * 34 - random() * 8;
  const rawGap = opening ? 54 + random() * 28 : 66 + difficulty * 58 + random() * 24;
  const gap = Math.min(rawGap, Math.max(54, 178 - current.width));
  const verticalRange = opening ? 18 : 24 + difficulty * 24;
  const yDelta = (random() * 2 - 1) * verticalRange;
  const height = 34 + Math.round(random() * 18);
  const hue = 176 + Math.round(random() * 130);
  const kindRoll = opening ? 0 : random();
  const hazardRoll = opening ? 1 : random();
  const kind = kindRoll > .82 ? 'bounce' : kindRoll > .62 ? 'fragile' : kindRoll > .38 ? 'moving' : 'normal';
  const y = clamp(current.y + yDelta, 148, 310);
  return {
    x: current.x + current.width + gap,
    y,
    width: clamp(width, 50, 96),
    height,
    hue,
    kind,
    hasHazard: score >= 5 && hazardRoll < .32 && kind !== 'bounce',
    baseY: y,
    phase: random() * Math.PI * 2,
  };
}

const DAILY_TARGET = 12;
const DAILY_REWARD = 80;
const TASKS = [
  { id: 'jump10', label: '完成 10 次跳跃', field: 'jumps', target: 10, reward: 50 },
  { id: 'perfect3', label: '累计 3 次完美落地', field: 'perfects', target: 3, reward: 50 },
  { id: 'score15', label: '单局达到 15 分', field: 'bestScore', target: 15, reward: 80 },
];
const SKINS = [
  { id: 'courier', name: '数据邮差', shape: 'courier', rarity: '标准', tagline: '青色面罩扫描路线，背包负责守住最后一枚芯片。', price: 0, body: '#19304d', accent: '#58f6e7' },
  { id: 'magenta', name: '故障浪人', shape: 'glitch', rarity: '稀有', tagline: '兜帽与残影披风，让追踪系统只看见一串坏像素。', price: 120, body: '#401947', accent: '#ff4fa3' },
  { id: 'gold', name: '黄金脉冲', shape: 'armor', rarity: '史诗', tagline: '每次完美落地，都像一次高压放电。', price: 260, body: '#4a391b', accent: '#ffd05a' },
  { id: 'cyan', name: '量子青蓝', shape: 'armor', rarity: '传说', tagline: '来自天际线尽头的实验型配送装甲。', price: 420, body: '#153f46', accent: '#58f6e7' },
];
function dailyKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}
function dailySeed(key) {
  let hash = 2166136261;
  for (let i = 0; i < key.length; i += 1) { hash ^= key.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
}
function seededRandom(seed) {
  let value = seed >>> 0;
  return () => {
    value += 0x6D2B79F5;
    let t = value;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function resolveDailyCompletion(progress, completedKey, key = dailyKey()) {
  const complete = progress >= DAILY_TARGET;
  return { complete, reward: complete && completedKey !== key ? DAILY_REWARD : 0, completedKey: complete ? key : completedKey };
}
function createTaskState() { return { jumps: 0, perfects: 0, bestScore: 0, claimed: [] }; }
function normalizeTaskState(value) {
  const source = value && typeof value === 'object' ? value : {};
  const number = (input) => Number.isFinite(Number(input)) ? Math.max(0, Math.floor(Number(input))) : 0;
  const validIds = new Set(TASKS.map((task) => task.id));
  return { jumps: number(source.jumps), perfects: number(source.perfects), bestScore: number(source.bestScore), claimed: Array.isArray(source.claimed) ? [...new Set(source.claimed.filter((id) => validIds.has(id)))] : [] };
}
function normalizeSkinState(value) {
  const source = value && typeof value === 'object' ? value : {};
  const validIds = new Set(SKINS.map((skin) => skin.id));
  const unlocked = Array.isArray(source.unlocked) ? [...new Set(source.unlocked.filter((id) => validIds.has(id)))] : [];
  if (!unlocked.includes('courier')) unlocked.unshift('courier');
  const equipped = validIds.has(source.equipped) && unlocked.includes(source.equipped) ? source.equipped : 'courier';
  const coins = Number.isFinite(Number(source.coins)) ? Math.max(0, Math.floor(Number(source.coins))) : 0;
  return { coins, unlocked, equipped };
}
function advanceTasks(current, progress) {
  current = normalizeTaskState(current);
  const state = {
    jumps: current.jumps + (progress.jumps || 0),
    perfects: current.perfects + (progress.perfects || 0),
    bestScore: Math.max(current.bestScore, progress.bestScore || 0),
    claimed: [...current.claimed],
  };
  const completed = [];
  let coinsEarned = 0;
  for (const task of TASKS) {
    if (state[task.field] < task.target || state.claimed.includes(task.id)) continue;
    state.claimed.push(task.id); completed.push(task.id); coinsEarned += task.reward;
  }
  return { state, coinsEarned, completed };
}
function purchaseSkin(state, skinId) {
  state = normalizeSkinState(state);
  const skin = SKINS.find((item) => item.id === skinId);
  if (!skin) return { ok: false, reason: 'missing', state };
  if (state.unlocked.includes(skinId)) return { ok: true, reason: 'equipped', state: { ...state, equipped: skinId } };
  if (state.coins < skin.price) return { ok: false, reason: 'coins', state };
  return { ok: true, reason: 'purchased', state: { coins: state.coins - skin.price, unlocked: [...state.unlocked, skinId], equipped: skinId } };
}

let combo = 0;

let dailyWon = false;

let runRandom = Math.random;
let fragileTimer = 0;
let taskState = loadSave().taskState;
let skinState = loadSave().skinState;
let dailyCompleted = loadSave().dailyCompleted;
let selectedSkinId = skinState.equipped;

function loadSave() {
  const defaults = { best: 0, muted: false, played: false, dailyCompleted: '', taskState: createTaskState(), skinState: { coins: 0, unlocked: ['courier'], equipped: 'courier' } };
  try {
    const saved = { ...defaults, ...JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') };
    saved.taskState = normalizeTaskState(saved.taskState);
    saved.skinState = normalizeSkinState(saved.skinState);
    return saved;
  } catch { return defaults; }
}

function persist(extra = {}) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ best, muted, played: true, dailyCompleted, taskState, skinState, ...extra }));
  } catch {
    // 部分手机浏览器会限制 file:// 页面的本地存储；不影响离线游玩。
  }
}

function resetGame(isDaily = false) {
  dailyMode = isDaily;
  dailyWon = false;
  dailyRewardEarned = 0;
  runRandom = isDaily ? seededRandom(dailySeed(dailyKey())) : Math.random;
  score = 0;
  combo = 0;
  action = 'idle';
  charge = 0;
  activePointer = null;
  particles = [];
  floaters = [];
  screenShake = 0;
  fragileTimer = 0;
  const first = { x: 80, y: 440, width: 108, height: 54, hue: 186, kind: 'normal', baseY: 440 };
  platforms = [first];
  for (let i = 1; i < 7; i += 1) platforms.push(makeNextPlatform(platforms[i - 1], i - 1, runRandom));
  currentPlatform = 0;
  player = { x: first.x + first.width / 2, y: first.y, vy: 0, squash: 0, trail: [] };
  cameraX = 0;
  cameraTarget = 0;
  mode = 'playing';
  jump = null;
  ui.startPanel.hidden = true;
  ui.gameOverPanel.hidden = true;
  ui.skinsPanel.hidden = true;
  ui.tutorial.hidden = !firstRun;
  persist();
}

function applyTaskProgress(progress) {
  const result = advanceTasks(taskState, progress);
  taskState = result.state;
  skinState.coins += result.coinsEarned;
  if (result.coinsEarned) floaters.push({ x: player.x, y: player.y - 70, text: `任务 +${result.coinsEarned}币`, life: 1.5, color: colors.amber });
  persist();
  renderMetaUi();
}

function beginCharge(pointerId) {
  if (mode !== 'playing' || action !== 'idle') return;
  ensureAudio();
  activePointer = pointerId;
  chargeStartedAt = performance.now();
  charge = 0;
  action = 'charging';
  ui.tutorial.hidden = true;
  firstRun = false;
  tone(160, .025, 'square', .025);
}

function dismissStartPanel() {
  if (!ui.startPanel) return;
  ui.startPanel.classList.add('is-dismissed');
  ui.startPanel.hidden = true;
  ui.startPanel.setAttribute('inert', '');
}

function showMenu() {
  mode = 'menu';
  action = 'idle';
  ui.gameOverPanel.hidden = true;
  ui.skinsPanel.hidden = true;
  ui.startPanel.classList.remove('is-dismissed');
  ui.startPanel.hidden = false;
  ui.startPanel.removeAttribute('inert');
  renderMetaUi();
}

function cancelCharge() {
  if (action !== 'charging') return;
  action = 'idle';
  charge = 0;
  activePointer = null;
  player.squash = 0;
}

function releaseCharge(pointerId) {
  if (mode !== 'playing' || action !== 'charging') return;
  if (activePointer !== null && pointerId !== activePointer) return;
  charge = chargeRatio(performance.now() - chargeStartedAt);
  const physics = jumpFromCharge(charge);
  if (platforms[currentPlatform]?.kind === 'bounce') {
    physics.distance *= 1.12;
    physics.height *= 1.28;
  }
  const target = platforms[currentPlatform + 1];
  jump = {
    startedAt: performance.now(),
    duration: physics.duration * 1000,
    startX: player.x,
    startY: player.y,
    endX: player.x + physics.distance,
    endY: target?.y ?? player.y + 20,
    height: physics.height,
    target,
  };
  action = 'jumping';
  activePointer = null;
  player.squash = 0;
  applyTaskProgress({ jumps: 1 });
  tone(260 + charge * 210, .08, 'square', .04);
}

function update(dt, now) {
  elapsed += dt;
  cameraX += (cameraTarget - cameraX) * Math.min(1, dt * 4.8);
  screenShake = Math.max(0, screenShake - dt * 18);
  for (let i = currentPlatform + 1; i < platforms.length; i += 1) {
    const p = platforms[i];
    if (p.kind === 'moving' && p !== jump?.target) p.y = (p.baseY ?? p.y) + Math.sin(elapsed * 1.8 + (p.phase ?? 0)) * 18;
  }

  if (mode === 'playing') {
    if (action === 'charging') {
      charge = chargeRatio(now - chargeStartedAt);
      player.squash = Math.sin(charge * Math.PI * .5) * 8;
      if (Math.floor((now - chargeStartedAt) / 130) !== Math.floor((now - chargeStartedAt - dt * 1000) / 130)) {
        tone(150 + charge * 330, .02, 'square', .012);
      }
    } else if (action === 'jumping' && jump) {
      const t = Math.min(1, (now - jump.startedAt) / jump.duration);
      const point = ballisticPoint(jump, t);
      player.x = point.x;
      player.y = point.y;
      player.trail.push({ x: player.x, y: player.y - 10, life: 1 });
      if (player.trail.length > 14) player.trail.shift();
      if (t >= 1) resolveLanding();
    } else if (action === 'falling') {
      player.vy += 520 * dt;
      player.y += player.vy * dt;
      player.x += 22 * dt;
      if (player.y - platforms[currentPlatform].y > H * .7) finishGame();
    } else if (action === 'idle' && fragileTimer > 0) {
      fragileTimer -= dt;
      if (fragileTimer <= 0) { action = 'falling'; player.vy = 42; }
    }
  }

  for (const p of player.trail) p.life -= dt * 3.2;
  player.trail = player.trail.filter((p) => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 170 * dt; p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
  for (const f of floaters) { f.y -= 24 * dt; f.life -= dt; }
  floaters = floaters.filter((f) => f.life > 0);
  for (const r of rain) {
    r.x -= 55 * dt; r.y += r.speed * dt;
    if (r.y > H + 10) { r.y = -10; r.x = Math.random() * W; }
    if (r.x < -10) r.x = W + 10;
  }
}

function resolveLanding() {
  const target = jump.target;
  const landing = target ? classifyLanding(player.x, target) : 'miss';
  const hazardHit = target?.hasHazard && Math.abs(player.x - (target.x + target.width / 2)) < Math.min(17, target.width * .18);
  if (landing === 'miss' || hazardHit) {
    action = 'falling';
    player.vy = 42;
    combo = 0;
    tone(92, .28, 'sawtooth', .05);
    return;
  }

  player.y = target.y;
  currentPlatform += 1;
  score += 1;
  const perfect = landing === 'perfect';
  if (perfect) {
    combo += 1;
    const bonus = Math.min(combo, 5);
    score += bonus;
    floaters.push({ x: player.x, y: player.y - 50, text: `完美 +${bonus}`, life: 1.1, color: colors.amber });
    burst(player.x, player.y - 4, colors.amber, 16);
    tone(660 + combo * 35, .12, 'square', .05);
    applyTaskProgress({ perfects: 1 });
  } else {
    combo = 0;
    floaters.push({ x: player.x, y: player.y - 46, text: landing === 'edge' ? '惊险!' : '+1', life: .8, color: landing === 'edge' ? colors.pink : colors.cyan });
    burst(player.x, player.y - 2, colors.cyan, 8);
    tone(430, .06, 'square', .035);
  }
  screenShake = landing === 'edge' ? 4 : 2;
  player.squash = 6;
  setTimeout(() => { if (action === 'idle') player.squash = 0; }, 120);
  action = 'idle';
  fragileTimer = target.kind === 'fragile' ? .85 : 0;
  jump = null;
  cameraTarget = Math.max(0, target.x - 120);
  while (platforms.length < currentPlatform + 7) {
    platforms.push(makeNextPlatform(platforms.at(-1), score, runRandom));
  }
  const dailyResult = resolveDailyCompletion(currentPlatform, dailyCompleted);
  if (dailyMode && dailyResult.complete) {
    dailyWon = true;
    dailyRewardEarned = dailyResult.reward;
    dailyCompleted = dailyResult.completedKey;
    skinState.coins += dailyResult.reward;
    persist();
    renderMetaUi();
    finishGame();
  }
}

function finishGame() {
  mode = 'gameover';
  action = 'idle';
  const previousBest = best;
  best = Math.max(best, score);
  applyTaskProgress({ bestScore: score });
  ui.finalScore.textContent = String(score);
  ui.bestScore.textContent = String(best);
  ui.gameOverEyebrow.textContent = dailyWon ? 'DAILY COMPLETE' : 'SIGNAL LOST';
  ui.gameOverTitle.textContent = dailyWon ? '挑战完成' : '坠入暗巷';
  ui.recordMessage.textContent = dailyWon
    ? dailyRewardEarned ? `今日首次通关 +${dailyRewardEarned} 像素币` : '今日挑战完成 · 奖励已领取'
    : score > previousBest && score > 0 ? 'NEW NIGHT RECORD // 新纪录' : combo >= 3 ? `最高连续完美 ${combo}` : '';
  ui.gameOverPanel.hidden = false;
}

function draw() {
  ctx.save();
  if (screenShake > 0) ctx.translate(Math.round((Math.random() - .5) * screenShake), Math.round((Math.random() - .5) * screenShake));
  drawSky();
  drawCity();
  drawRain();
  drawPlatforms();
  drawTrail();
  drawPlayer();
  drawParticles();
  if (mode === 'playing') drawHud();
  ctx.restore();
}

function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, colors.skyTop);
  gradient.addColorStop(.6, colors.skyBottom);
  gradient.addColorStop(1, '#101126');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(88,246,231,.05)';
  for (let y = 44; y < H; y += 44) ctx.fillRect(0, y, W, 1);
  for (let x = 0; x < W; x += 48) ctx.fillRect(x, 0, 1, H);
}

function drawCity() {
  const parallax = cameraX * .18;
  for (let i = -2; i < 11; i += 1) {
    const x = Math.round(i * 62 - (parallax % 62));
    const height = 90 + ((i * 37) % 115 + 115) % 115;
    const y = H - 118 - height;
    ctx.fillStyle = i % 2 ? '#10142d' : '#131733';
    ctx.fillRect(x, y, 52, height + 120);
    ctx.fillStyle = i % 3 ? '#34405e' : '#4e2f59';
    ctx.fillRect(x + 4, y - 4, 44, 4);
    for (let wy = y + 14; wy < H - 125; wy += 18) {
      for (let wx = x + 8; wx < x + 46; wx += 14) {
        const on = ((wx + wy + i * 9) % 5) < 2;
        ctx.fillStyle = on ? 'rgba(255,208,90,.52)' : 'rgba(55,70,100,.35)';
        ctx.fillRect(wx, wy, 5, 7);
      }
    }
  }
  ctx.fillStyle = '#080916';
  ctx.fillRect(0, H - 120, W, 120);
  ctx.fillStyle = colors.pink;
  ctx.fillRect(24, H - 106, 52, 4);
  ctx.fillStyle = colors.cyan;
  ctx.fillRect(W - 90, H - 82, 64, 3);
}

function worldToScreenX(x) { return Math.round(x - cameraX); }

function drawPlatforms() {
  for (let i = Math.max(0, currentPlatform - 2); i < platforms.length; i += 1) {
    const p = platforms[i];
    const x = worldToScreenX(p.x);
    if (x > W + 80 || x + p.width < -80) continue;
    const hue = p.hue ?? 190;
    const glow = i === currentPlatform + 1;
    ctx.save();
    if (glow) { ctx.shadowColor = `hsl(${hue} 90% 64%)`; ctx.shadowBlur = 12; }
    ctx.fillStyle = p.kind === 'bounce' ? colors.amber : p.kind === 'fragile' ? '#ff8469' : p.kind === 'moving' ? colors.blue : `hsl(${hue} 48% 46%)`;
    ctx.fillRect(x, p.y - 8, Math.round(p.width), 8);
    ctx.fillStyle = `hsl(${hue} 35% 27%)`;
    ctx.fillRect(x, p.y, Math.round(p.width), p.height);
    ctx.fillStyle = `hsl(${hue} 30% 18%)`;
    ctx.fillRect(x + 7, p.y + 8, Math.round(p.width - 14), p.height - 8);
    ctx.fillStyle = `hsl(${hue} 70% 65%)`;
    ctx.fillRect(x + 8, p.y + 12, Math.max(8, Math.round(p.width * .22)), 4);
    ctx.fillStyle = '#080915';
    for (let wx = x + 10; wx < x + p.width - 8; wx += 18) ctx.fillRect(wx, p.y + p.height - 11, 7, 5);
    if (p.kind === 'fragile') {
      ctx.strokeStyle = '#ffbea0'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x + p.width * .35, p.y); ctx.lineTo(x + p.width * .5, p.y + 16); ctx.lineTo(x + p.width * .62, p.y + 7); ctx.stroke();
    }
    if (p.kind === 'bounce') {
      ctx.strokeStyle = colors.amber; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x + 10, p.y + 12); ctx.lineTo(x + 20, p.y); ctx.lineTo(x + 30, p.y + 12); ctx.lineTo(x + 40, p.y); ctx.stroke();
    }
    if (p.hasHazard) {
      const center = x + p.width / 2;
      ctx.strokeStyle = colors.cyan; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(center - 16, p.y - 8); ctx.lineTo(center - 8, p.y - 20); ctx.lineTo(center, p.y - 8); ctx.lineTo(center + 8, p.y - 20); ctx.lineTo(center + 16, p.y - 8); ctx.stroke();
    }
    if (glow) {
      ctx.globalAlpha = .55 + Math.sin(elapsed * 4) * .2;
      ctx.strokeStyle = `hsl(${hue} 90% 70%)`;
      ctx.strokeRect(x - 2, p.y - 10, Math.round(p.width + 4), p.height + 12);
    }
    ctx.restore();
  }
}

function drawPlayer() {
  if (mode === 'menu' && platforms.length === 0) return;
  const x = worldToScreenX(player.x);
  const y = Math.round(player.y);
  const squash = Math.round(player.squash);
  ctx.save();
  ctx.translate(x, y);
  if (action === 'jumping') ctx.rotate(Math.sin((performance.now() - jump.startedAt) / jump.duration * Math.PI * 2) * .18);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.fillRect(-13, 2, 26, 5);
  const skin = SKINS.find((item) => item.id === skinState.equipped) || SKINS[0];
  if (skin.shape === 'courier') {
    ctx.fillStyle = skin.body; ctx.fillRect(-9, -31 + squash, 18, 25 - squash);
    ctx.fillStyle = '#0b1425'; ctx.fillRect(7, -27 + squash, 7, 17 - squash);
    ctx.fillStyle = '#13172c'; ctx.fillRect(-9, -47 + squash, 18, 15);
    ctx.fillStyle = skin.accent; ctx.fillRect(-7, -40 + squash, 14, 5); ctx.fillRect(9, -25 + squash, 5, 11);
  } else if (skin.shape === 'glitch') {
    ctx.fillStyle = skin.body; ctx.fillRect(-12, -34 + squash, 24, 28 - squash); ctx.fillRect(7, -20 + squash, 9, 17 - squash);
    ctx.fillStyle = skin.accent; ctx.fillRect(-12, -31 + squash, 5, 19 - squash); ctx.fillRect(12, -23 + squash, 5, 4); ctx.fillRect(-16, -13 + squash, 5, 4);
    ctx.fillStyle = '#140b1c'; ctx.fillRect(-11, -48 + squash, 22, 16); ctx.fillRect(-14, -43 + squash, 5, 10);
    ctx.fillStyle = skin.accent; ctx.fillRect(-7, -41 + squash, 14, 4);
  } else {
    ctx.fillStyle = skin.body; ctx.fillRect(-8, -33 + squash, 16, 27 - squash);
    ctx.fillStyle = skin.accent; ctx.fillRect(-8, -28 + squash, 4, 17 - squash);
    ctx.fillStyle = '#2c3f70'; ctx.fillRect(-10, -31 + squash, 4, 21 - squash);
    ctx.fillStyle = '#ffd7ba'; ctx.fillRect(-7, -43 + squash, 14, 12);
    ctx.fillStyle = '#13172c'; ctx.fillRect(-8, -46 + squash, 16, 6); ctx.fillRect(-9, -42 + squash, 4, 8);
    ctx.fillStyle = skin.accent; ctx.fillRect(2, -39 + squash, 4, 3);
  }
  ctx.fillStyle = '#050611';
  ctx.fillRect(-7, -7, 6, 7);
  ctx.fillRect(2, -7, 6, 7);
  ctx.restore();
}

function drawTrail() {
  for (const p of player.trail) {
    ctx.globalAlpha = p.life * .45;
    ctx.fillStyle = colors.pink;
    ctx.fillRect(worldToScreenX(p.x) - 4, p.y, 8, 3);
  }
  ctx.globalAlpha = 1;
}

function drawRain() {
  ctx.strokeStyle = 'rgba(110,180,255,.17)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const r of rain) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 4, r.y + 10); }
  ctx.stroke();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(worldToScreenX(p.x), p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.fillStyle = '#050611';
    ctx.fillText(f.text, worldToScreenX(f.x) + 2, f.y + 2);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, worldToScreenX(f.x), f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(7,9,23,.78)';
  ctx.fillRect(16, 18, 132, 54);
  ctx.fillStyle = colors.cyan;
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillText('SIGNAL SCORE', 26, 35);
  ctx.fillStyle = colors.paper;
  ctx.font = 'bold 26px "Courier New", monospace';
  ctx.fillText(String(score).padStart(3, '0'), 24, 62);

  ctx.textAlign = 'right';
  ctx.fillStyle = colors.amber;
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillText(dailyMode ? `DAILY ${Math.min(currentPlatform, DAILY_TARGET)}/${DAILY_TARGET}` : `COINS ${skinState.coins}`, W - 20, 22);

  if (combo > 1) {
    ctx.textAlign = 'right';
    ctx.fillStyle = colors.amber;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`PERFECT x${combo}`, W - 20, 36);
  }

  if (action === 'charging') {
    const barW = 220;
    const x = (W - barW) / 2;
    const y = H - 66;
    ctx.fillStyle = 'rgba(7,9,23,.88)';
    ctx.fillRect(x - 8, y - 19, barW + 16, 38);
    ctx.fillStyle = '#25314c';
    ctx.fillRect(x, y, barW, 8);
    ctx.fillStyle = charge > .86 ? colors.pink : colors.cyan;
    ctx.fillRect(x, y, Math.round(barW * charge), 8);
    ctx.fillStyle = colors.paper;
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(charge >= 1 ? 'MAX POWER / 松开!' : 'CHARGING', W / 2, y - 7);
  }
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i += 1) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 38 + Math.random() * 74;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 42, life: .45 + Math.random() * .45, size: 2 + Math.floor(Math.random() * 3), color });
  }
}

function makeRain() {
  return Array.from({ length: 42 }, () => ({ x: Math.random() * W, y: Math.random() * H, speed: 170 + Math.random() * 160 }));
}

function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
}

function tone(frequency, duration, type = 'square', gainValue = .03) {
  if (muted) return;
  ensureAudio();
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(gainValue, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start();
  oscillator.stop(audio.currentTime + duration);
}

function renderMetaUi() {
  ui.coinCount.textContent = String(skinState.coins);
  ui.shopCoinCount.textContent = String(skinState.coins);
  ui.dailyStatus.textContent = dailyCompleted === dailyKey() ? '今日已完成' : `${DAILY_TARGET} 跳 / +${DAILY_REWARD}币`;
  ui.taskList.innerHTML = TASKS.map((task) => {
    const value = Math.min(taskState[task.field], task.target);
    const done = taskState.claimed.includes(task.id);
    return `<div class="task-row"><span>${done ? '✓ ' : ''}${task.label}</span><span>${value}/${task.target} · ${task.reward}币</span></div>`;
  }).join('');
  const selected = SKINS.find((skin) => skin.id === selectedSkinId) || SKINS[0];
  const selectedOwned = skinState.unlocked.includes(selected.id);
  const selectedEquipped = skinState.equipped === selected.id;
  ui.skinStage.style.setProperty('--skin-body', selected.body);
  ui.skinStage.style.setProperty('--skin-accent', selected.accent);
  ui.shopAvatar.dataset.shape = selected.shape || 'armor';
  ui.shopAvatar.style.setProperty('--skin-body', selected.body);
  ui.shopAvatar.style.setProperty('--skin-accent', selected.accent);
  ui.skinRarity.textContent = `${selected.rarity} / ${selectedOwned ? '已解锁' : '未解锁'}`;
  ui.skinRarity.style.setProperty('--skin-accent', selected.accent);
  ui.skinName.textContent = selected.name;
  ui.skinTagline.textContent = selected.tagline;
  ui.skinPriceText.textContent = selectedOwned ? (selectedEquipped ? '当前装备' : '已拥有') : `${skinState.coins} / ${selected.price} 像素币`;
  ui.skinPriceBar.style.width = selectedOwned ? '100%' : `${Math.min(100, skinState.coins / selected.price * 100)}%`;
  ui.skinPriceBar.style.background = selected.accent;
  ui.skinActionButton.textContent = selectedEquipped ? '已装备' : selectedOwned ? '装备这套皮肤' : `解锁 · ${selected.price} 币`;
  ui.skinActionButton.disabled = selectedEquipped;
  ui.skinGrid.innerHTML = SKINS.map((skin) => {
    const owned = skinState.unlocked.includes(skin.id);
    const equipped = skinState.equipped === skin.id;
    const selectedClass = selectedSkinId === skin.id ? ' is-selected' : '';
    return `<button class="skin-card${equipped ? ' is-equipped' : ''}${selectedClass}" style="--skin-body:${skin.body};--skin-accent:${skin.accent}" type="button" data-skin="${skin.id}" aria-label="预览${skin.name}"><span class="skin-swatch skin-swatch--${skin.shape || 'armor'}"></span><strong>${skin.name}</strong></button>`;
  }).join('');
}

function openSkins() {
  ui.startPanel.hidden = true;
  ui.skinsPanel.hidden = false;
  selectedSkinId = skinState.equipped;
  ui.shopMessage.textContent = '选择一套装备，查看完整预览。';
  renderMetaUi();
}

function lerp(a, b, t) { return a + (b - a) * t; }

function loop(now) {
  const dt = Math.min(.034, (now - lastTime) / 1000 || 0);
  lastTime = now;
  update(dt, now);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  canvas.setPointerCapture?.(event.pointerId);
  beginCharge(event.pointerId);
});
window.addEventListener('pointerup', (event) => {
  if (action !== 'charging') return;
  event.preventDefault();
  releaseCharge(event.pointerId);
}, { capture: true, passive: false });
window.addEventListener('pointercancel', (event) => {
  if (activePointer !== null && event.pointerId !== activePointer) return;
  cancelCharge();
}, { capture: true });
canvas.addEventListener('contextmenu', (event) => event.preventDefault());
window.addEventListener('blur', cancelCharge);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelCharge(); });

ui.startButton.addEventListener('click', () => {
  if (uiBusy) return;
  uiBusy = true;
  dismissStartPanel();
  ensureAudio();
  resetGame(false);
  requestAnimationFrame(() => { uiBusy = false; });
});
ui.dailyButton.addEventListener('click', () => {
  if (uiBusy) return;
  uiBusy = true;
  dismissStartPanel();
  ensureAudio();
  resetGame(true);
  requestAnimationFrame(() => { uiBusy = false; });
});
ui.skinsButton.addEventListener('click', openSkins);
ui.closeSkinsButton.addEventListener('click', showMenu);
ui.skinGrid.addEventListener('click', (event) => {
  const card = event.target.closest('[data-skin]');
  if (!card) return;
  selectedSkinId = card.dataset.skin;
  ui.shopMessage.textContent = '预览已更新。确认后再解锁或装备。';
  renderMetaUi();
  tone(380, .035, 'square', .018);
});
ui.skinActionButton.addEventListener('click', () => {
  const result = purchaseSkin(skinState, selectedSkinId);
  skinState = result.state;
  ui.shopMessage.textContent = result.ok
    ? result.reason === 'purchased' ? '解锁成功，已自动装备。现在去屋顶亮相吧。' : '装备完成，外观已即时生效。'
    : result.reason === 'coins' ? '像素币不足，完成任务或每日挑战可以获得。' : '皮肤不存在。';
  persist();
  renderMetaUi();
  tone(result.ok ? 620 : 120, .08, 'square', .03);
});
ui.restartButton.addEventListener('click', () => {
  if (uiBusy) return;
  uiBusy = true;
  ensureAudio();
  resetGame(dailyMode);
  requestAnimationFrame(() => { uiBusy = false; });
});
ui.menuButton.addEventListener('click', showMenu);
ui.muteButton.addEventListener('click', () => {
  muted = !muted;
  ui.muteButton.textContent = muted ? '声音 OFF' : '声音 ON';
  persist();
  if (!muted) tone(520, .05, 'square', .03);
});

ui.muteButton.textContent = muted ? '声音 OFF' : '声音 ON';
ui.deviceHint.textContent = matchMedia('(pointer: coarse)').matches ? 'TOUCH READY' : 'POINTER READY';
resetGame(false);
showMenu();
ui.tutorial.hidden = true;
renderMetaUi();
requestAnimationFrame(loop);

</script>
  </body>
</html>
